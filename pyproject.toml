[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "volatility_research"
version = "0.1.0"
description = "Pesquisa quantitativa de volatilidade para B3"
requires-python = ">=3.10"

dependencies = [
    # data
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=15",
    "pytz>=2023",
    "tzdata>=2023",

    # stats & ml
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "arch>=7",
    "joblib>=1.3",

    # finance
    "yfinance>=0.2",
    "pyfolio-reloaded>=0.9",
    "empyrical-reloaded>=0.5",
    "ta>=0.10",

    # viz
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.18",

    # jupyter
    "jupyter>=1.0",
    "ipykernel>=6.25",

    # http
    "httpx>=0.25",

    # yaml configs
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "ARG", "RUF",
]
ignore = [
    "E501",    # line-length já configurado acima
    "N818",    # permite Exception sem sufixo Error
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
